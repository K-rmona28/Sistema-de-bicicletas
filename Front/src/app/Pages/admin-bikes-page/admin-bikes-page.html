<div class="panel">
    <div class="container">
        <div class="container-header">
            <h2>Lista de bicicletas</h2>
            <button type="button" class="new-btn" (click)="openCreateModal()">
                <i class="fa-solid fa-plus"></i>
                Agregar bicicleta
            </button>
        </div>

        <mat-form-field appearance="outline" class="filter" subscriptSizing="dynamic">
            <mat-label>Filtrar</mat-label>
            <input matInput (keyup)="applyFilter($event)" placeholder="Ej. Trail" #input>
            <mat-icon matSuffix>search</mat-icon>
        </mat-form-field>

        <div class="table-container">
            <table mat-table [dataSource]="dataSource" matSort>

                <ng-container matColumnDef="id">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
                    <td mat-cell *matCellDef="let row">{{ row.id }}</td>
                </ng-container>

                <ng-container matColumnDef="code">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>Código</th>
                    <td mat-cell *matCellDef="let row">{{ row.code }}</td>
                </ng-container>

                <ng-container matColumnDef="model">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>Modelo</th>
                    <td mat-cell *matCellDef="let row">{{ row.model }}</td>
                </ng-container>

                <ng-container matColumnDef="status">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>Estado</th>
                    <td mat-cell *matCellDef="let row">{{ row.status }}</td>
                </ng-container>

                <ng-container matColumnDef="station">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header>Estación</th>
                    <td mat-cell *matCellDef="let row">{{ row.station }}</td>
                </ng-container>

                <ng-container matColumnDef="actions">
                    <th mat-header-cell *matHeaderCellDef>Acciones</th>
                    <td mat-cell *matCellDef="let row">
                        <button mat-icon-button (click)="openEditModal(row)">
                            <mat-icon>edit</mat-icon>
                        </button>
                        <button mat-icon-button (click)="deleteBike(row)">
                            <mat-icon>delete</mat-icon>
                        </button>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

                <tr class="mat-row" *matNoDataRow>
                    <td class="mat-cell" colspan="6">
                        No hay bicicletas que coincidan con "{{ input.value }}"
                    </td>
                </tr>
            </table>

            <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Seleccionar página de bicicletas">
            </mat-paginator>
        </div>
    </div>
</div>
