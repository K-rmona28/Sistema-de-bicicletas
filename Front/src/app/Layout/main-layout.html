<header class="navbar" [class.dark]="dark()">
  <a class="brand" routerLink="/home">Cycleon</a>

  <nav>
    @for (link of links; track link.path) {
      <a [routerLink]="link.path" routerLinkActive="active">{{ link.label }}</a>
    }
  </nav>

  <div class="user">
    <span class="user-name">
      <i class="fa-solid fa-circle-user"></i>
      {{ userName() }}
    </span>

    <button type="button" class="logout" aria-label="Cerrar sesión" title="Cerrar sesión" (click)="logout()">
      <i class="fa-solid fa-right-from-bracket"></i>
    </button>
  </div>
</header>

<main>
  <router-outlet />
</main>
