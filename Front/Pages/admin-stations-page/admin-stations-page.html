<div class="panel">
  <div class="container">
    <div class="container-header">
      <h2>Estaciones</h2>

      <div class="actions">
        <button type="button" class="new-btn" (click)="openRedistribute()">
          <i class="fa-solid fa-arrows-left-right"></i>
          Redistribuir bicicletas
        </button>

        <button type="button" class="new-btn" (click)="openCreateStation()">
          <i class="fa-solid fa-location-dot"></i>
          Nueva estación
        </button>

        <button type="button" class="new-btn" (click)="openExpandCapacity()">
          <i class="fa-solid fa-maximize"></i>
          Expandir capacidad
        </button>
      </div>
    </div>

    <mat-form-field appearance="outline" class="filter" subscriptSizing="dynamic">
      <mat-label>Filtrar</mat-label>
      <input matInput (keyup)="applyFilter($event)" placeholder="Ej. Poblado" #input>
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>

    <div class="table-container">
      <table mat-table [dataSource]="dataSource" matSort>

        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Estación</th>
          <td mat-cell *matCellDef="let row">{{ row.name }}</td>
        </ng-container>

        <ng-container matColumnDef="capacity">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Capacidad</th>
          <td mat-cell *matCellDef="let row">{{ row.occupied }} / {{ row.capacity }}</td>
        </ng-container>

        <ng-container matColumnDef="available">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Bicicletas disponibles</th>
          <td mat-cell *matCellDef="let row">{{ row.available }}</td>
        </ng-container>

        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Estado</th>
          <td mat-cell *matCellDef="let row">
            <span class="st" [attr.data-s]="row.status">{{ row.statusLabel }}</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Acciones</th>
          <td mat-cell *matCellDef="let row">
            <button
              mat-icon-button
              [title]="row.status === 'INACTIVA' ? 'Activar estación' : 'Inactivar estación'"
              (click)="toggleStationActive(row)">
              <mat-icon>{{ row.status === 'INACTIVA' ? 'power_settings_new' : 'block' }}</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" colspan="5">
            No hay estaciones que coincidan con "{{ input.value }}"
          </td>
        </tr>
      </table>

      <mat-paginator
        [pageSizeOptions]="[5, 10, 25, 100]"
        aria-label="Seleccionar página de estaciones">
      </mat-paginator>
    </div>
  </div>
</div>
